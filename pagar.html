<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paga tu pedido — MF Colombia</title>
<meta name="description" content="Completa tu pago en línea de forma segura. MF Colombia, tacones y plataformas.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MF Colombia">
<meta property="og:title" content="Paga tu pedido — MF Colombia">
<meta property="og:description" content="Completa tu pago en línea de forma segura con Bold.">
<meta property="og:image" content="https://marlonfootwearcol.netlify.app/assets/026-ff2341dac0.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1500">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F3EFE7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1613'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23B08F63' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#F3EFE7;--ink:#1A1613;--muted:#726A5E;--line:#DDD5C4;--champagne:#B08F63;--serif:"Fraunces","Cormorant Garamond",Georgia,serif;--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--ivory);color:var(--ink);font-family:var(--sans);padding:32px;text-align:center}
  .card{max-width:380px}
  h1{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:0;margin:0 0 12px}
  p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 28px}
  .spinner{width:26px;height:26px;border:2px solid #DDD5C4;border-top-color:var(--ink);border-radius:50%;margin:0 auto 20px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-block;min-height:52px;line-height:52px;padding:0 30px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px;font-weight:500}
  .err{display:none}
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spin"></div>
    <h1>MF Colombia</h1>
    <p id="msg">Te estamos llevando a tu página de pago seguro con Bold. Si no se abre sola, toca el botón.</p>
    <a class="btn" id="goBtn" href="#" rel="noopener">Ir a pagar ahora</a>
  </div>
  <script>
  (async function () {
    var params = new URLSearchParams(window.location.search);
    var ref = params.get("ref") || "";
    var btn = document.getElementById("goBtn");
    var msg = document.getElementById("msg");
    if (!ref) {
      document.getElementById("spin").style.display = "none";
      msg.textContent = "Este enlace de pago no tiene una referencia válida.";
      btn.remove();
      return;
    }

    try {
      var res = await fetch("/.netlify/functions/order-status?ref=" + encodeURIComponent(ref), { cache: "no-store" });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.paymentLink) throw new Error(data.error || "El link de pago todavía no está disponible.");

      btn.href = data.paymentLink;
      setTimeout(function () { window.location.href = data.paymentLink; }, 700);
    } catch (error) {
      document.getElementById("spin").style.display = "none";
      msg.textContent = "Este pedido no tiene un link de pago válido o todavía no está disponible. Escríbenos por WhatsApp para recibir ayuda.";
      btn.remove();
    }
  })();
  </script>
</body>
</html>

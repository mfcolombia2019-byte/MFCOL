<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estado de tu pago — MF</title>
<meta name="description" content="Estado de pago de tu pedido con MF.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EFE7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1613'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23B08F63' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#dfe8d3;--paper:rgba(255,255,255,.6);--ink:#111;--muted:#555;--serif:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--sans:"Figtree",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#1b1b1b;color:var(--ink);font-family:var(--sans);padding:24px 12px calc(24px + env(safe-area-inset-bottom));line-height:1.45}
  .card{width:min(390px,calc(100vw - 24px));min-height:min(780px,calc(100dvh - 24px));padding:24px 24px 32px;border-radius:32px;background:var(--bg);display:flex;flex-direction:column;text-align:center}
  .mark{width:52px;height:52px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:24px auto 24px;font-size:24px;font-weight:700}
  h1{font-family:var(--serif);font-weight:800;font-size:33.6px;letter-spacing:-.03em;line-height:.98;margin:0 0 14px}
  p{color:#333;font-size:15px;margin:0 0 8px}
  .ref{display:block;margin:24px 0 0;padding:16px;border-radius:24px;border:0;background:var(--paper);font-size:13.5px;color:var(--ink)}
  .ref b{font-weight:700;letter-spacing:.02em}
  .summary{display:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;padding:0 24px;text-decoration:none;font-family:inherit;font-size:16px;font-weight:600;border:2px solid #111;border-radius:999px;background:#111;color:#fff;margin-top:auto;cursor:pointer}
  .btn:hover{background:transparent;color:#111}
  .btn[hidden]{display:none}
  #retryBtn:not([hidden]) + #waBtn{margin-top:12px;background:transparent;color:#111}
  #retryBtn:not([hidden]) + #waBtn:hover{background:#111;color:#fff}
  .wa-note{display:none}
  .muted-link{display:inline-block;margin-top:16px;color:#555;font-size:13.5px;text-decoration:none}
  .noref{display:none}
  .card:after{content:"MF";font-family:var(--serif);font-size:14px;color:#555;margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">MF</div>
    <h1 id="title" aria-live="polite">Consultando el estado de tu pago…</h1>
    <p id="intro" aria-live="polite">Estamos verificando en el servidor si tu pago fue aprobado. No asumimos que el pago está confirmado hasta recibir esa confirmación.</p>
    <p class="ref" id="refBox" hidden>Referencia de tu pedido: <b id="refNum"></b></p>

    <div class="summary" id="resumen"></div>

    <button class="btn" id="retryBtn" type="button" hidden>Verificar de nuevo</button>
    <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener">Hablar por WhatsApp</a>
    <p class="wa-note">Opcional — escríbenos solo si necesitas ayuda con tu pedido.</p>

    <a class="muted-link" href="/">Volver a la tienda</a>
  </div>
  <script>
  (function () {
    var WHATSAPP_NUMBER = "573115752334";
    // Pausa (segundos) entre consultas: ~2,5 minutos en total, cada vez más espaciadas.
    // El servidor además limita a una consulta a Bold cada 15 s por pedido.
    var DELAYS_SECONDS = [3, 3, 4, 5, 5, 10, 10, 10, 15, 15, 15, 15, 15, 15, 15];
    var REQUEST_TIMEOUT_MS = 15000;
    var VALID_STATUSES = ["pendiente", "aprobado", "rechazado", "anulado"];

    var params = new URLSearchParams(window.location.search);
    // Solo se usa `ref`. Los parámetros que agrega Bold al regresar (bold-tx-status, etc.)
    // los puede editar cualquiera desde la barra de direcciones: nunca se usan como prueba de pago.
    var ref = params.get("ref") || "";
    var title = document.getElementById("title");
    var intro = document.getElementById("intro");
    var resumenEl = document.getElementById("resumen");
    var waBtn = document.getElementById("waBtn");
    var retryBtn = document.getElementById("retryBtn");
    var refBox = document.getElementById("refBox");
    var refNum = document.getElementById("refNum");
    var running = false;

    function setText(heading, text) {
      title.textContent = heading;
      intro.textContent = text;
    }

    function setWhatsApp(message) {
      waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);
    }

    function sleep(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    if (!ref) {
      setText("Regresaste del proceso de pago", "No recibimos una referencia de pedido. El estado del pago debe confirmarse desde el servidor.");
      resumenEl.style.display = "none";
      setWhatsApp("Hola, MF. Regresé del proceso de pago y necesito confirmar el estado de mi pedido.");
      return;
    }

    refNum.textContent = ref;
    refBox.hidden = false;
    setWhatsApp("Hola, MF. Necesito confirmar el estado del pedido " + ref + ".");

    // Resultado de una consulta: { kind: "ok" | "temporary" | "permanent", data?, notFound? }
    async function fetchStatus() {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);
      try {
        var res = await fetch("/.netlify/functions/order-status?ref=" + encodeURIComponent(ref), {
          cache: "no-store",
          signal: controller.signal
        });
        if (res.ok) {
          var data = await res.json().catch(function () { return null; });
          var validReference = data && typeof data.reference === "string" && data.reference.length > 0;
          var validStatus = data && VALID_STATUSES.indexOf(data.paymentStatus) !== -1;
          if (!validReference || !validStatus) return { kind: "permanent" };
          if (data.reference !== ref) return { kind: "permanent" };
          return { kind: "ok", data: data };
        }
        if (res.status === 429 || res.status >= 500) return { kind: "temporary" };
        return { kind: "permanent", notFound: res.status === 404 };
      } catch (error) {
        // Red caída, tiempo agotado o similar: es temporal y no dice nada sobre el pago.
        return { kind: "temporary" };
      } finally {
        clearTimeout(timer);
      }
    }

    function savedOrder() {
      try {
        var raw = localStorage.getItem("mf_order_" + ref);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function contactMessage(statusSentence) {
      var msg = "Hola, MF. Regresé del proceso de pago (referencia " + ref + "). " + statusSentence;
      var order = savedOrder();
      if (order) msg += "\n" + (order.pedidoTxt || "") + "\nTotal: " + (order.total || "");
      return msg;
    }

    function showWaiting(temporaryProblem) {
      setText(
        "Consultando el estado de tu pago…",
        temporaryProblem
          ? "No pudimos consultar el estado en este momento. Esto no significa que el pago haya fallado; seguimos intentando."
          : "Aún no recibimos la confirmación de Bold. Seguimos consultando automáticamente; no cierres esta página."
      );
    }

    function showApproved(data) {
      setText("¡Tu pago ha sido aprobado!", "Gracias por tu compra. En breve recibirás un correo con los detalles de tu pedido.");
      resumenEl.textContent = "Referencia: " + data.reference + "\nEstado del pago: " + data.paymentStatus;
      setWhatsApp(contactMessage("Estado confirmado por el servidor: aprobado."));
      try { localStorage.removeItem("mf_order_" + ref); } catch (e) {}
    }

    function showNotApproved(data) {
      setText(
        "Pago no confirmado",
        "Bold informó que este pago no fue aprobado. Si lo intentaste de nuevo o crees que es un error, escríbenos por WhatsApp con tu referencia."
      );
      resumenEl.textContent = "Referencia: " + data.reference + "\nEstado del pago: " + data.paymentStatus;
      setWhatsApp(contactMessage("Estado confirmado por el servidor: " + data.paymentStatus + "."));
    }

    function showStillPending(data, temporaryProblem) {
      setText(
        "Estamos esperando la confirmación de tu pago",
        temporaryProblem
          ? "No logramos consultar a Bold en los últimos intentos. Esto no significa que el pago haya fallado. Tu pedido quedó registrado y no se da por pagado hasta recibir la confirmación. Puedes verificar de nuevo en unos minutos o escribirnos con tu referencia."
          : "Todavía no recibimos la confirmación de Bold. Tu pedido quedó registrado y no se da por pagado hasta recibirla. Puedes verificar de nuevo en unos minutos o escribirnos con tu referencia."
      );
      resumenEl.textContent = "Referencia: " + data.reference + "\nEstado del pago: " + data.paymentStatus;
      setWhatsApp(contactMessage("Estado confirmado por el servidor: pendiente."));
      retryBtn.hidden = false;
    }

    function showTemporaryFailure() {
      setText(
        "No pudimos consultar el estado de tu pago",
        "Hubo un problema temporal al comunicarnos con el servidor. Esto no significa que el pago haya fallado ni que se haya aprobado. Intenta de nuevo en unos minutos o escríbenos con tu referencia."
      );
      resumenEl.textContent = "Referencia: " + ref;
      setWhatsApp(contactMessage("No pude verificar el estado del pago; necesito confirmarlo."));
      retryBtn.hidden = false;
    }

    function showPermanentFailure(result) {
      setText(
        "No pudimos verificar el pago",
        result.notFound
          ? "No encontramos un pedido con esa referencia. El pago no se considera confirmado."
          : "No fue posible validar de forma segura el estado de tu pedido. El pago no se considera confirmado."
      );
      resumenEl.textContent = "Referencia: " + ref;
      setWhatsApp("Hola, MF. Necesito confirmar el estado del pedido " + ref + ".");
    }

    async function checkPayment() {
      if (running) return;
      running = true;
      retryBtn.hidden = true;
      showWaiting(false);

      var data = null;
      var temporaryProblem = false;

      for (var attempt = 0; attempt <= DELAYS_SECONDS.length; attempt += 1) {
        var result = await fetchStatus();

        if (result.kind === "permanent") {
          showPermanentFailure(result);
          running = false;
          return;
        }

        if (result.kind === "ok") {
          data = result.data;
          if (data.paymentStatus === "aprobado") { showApproved(data); running = false; return; }
          if (data.paymentStatus === "rechazado" || data.paymentStatus === "anulado") { showNotApproved(data); running = false; return; }
          // verification = "recent" no aporta información nueva: se conserva el último resultado.
          if (data.verification === "unavailable") temporaryProblem = true;
          else if (data.verification === "checked") temporaryProblem = false;
        } else {
          temporaryProblem = true;
        }

        showWaiting(temporaryProblem);
        if (attempt < DELAYS_SECONDS.length) await sleep(DELAYS_SECONDS[attempt] * 1000);
      }

      if (data) showStillPending(data, temporaryProblem);
      else showTemporaryFailure();
      running = false;
    }

    retryBtn.addEventListener("click", checkPayment);
    checkPayment();
  })();
  </script>
</body>
</html>

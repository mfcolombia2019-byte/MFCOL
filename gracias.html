<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Pago recibido! — MF Colombia</title>
<meta name="description" content="Confirmación de pago de tu pedido con MF Colombia.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EFE7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1613'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23B08F63' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#F3EFE7;--paper:#fff;--ink:#1A1613;--muted:#726A5E;--line:#DDD5C4;--champagne:#B08F63;--accent:#6E2A32;--accent-deep:#551F26;--serif:"Fraunces","Cormorant Garamond",Georgia,serif;--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--ivory);color:var(--ink);font-family:var(--sans);padding:32px 20px calc(32px + env(safe-area-inset-bottom));text-align:center;line-height:1.55}
  .card{max-width:440px;width:100%}
  .mark{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--champagne);display:grid;place-items:center;margin:0 auto 24px;font-family:var(--serif);font-size:20px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,7vw,38px);line-height:1.1;margin:0 0 14px}
  p{color:var(--muted);font-size:15.5px;margin:0 0 8px}
  .ref{display:inline-block;margin:14px 0 26px;padding:10px 18px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;color:var(--ink)}
  .ref b{font-weight:600;letter-spacing:.02em}
  .summary{background:var(--paper);border:1px solid var(--line);padding:18px;text-align:left;font-size:13.5px;color:var(--ink);white-space:pre-line;margin:0 0 28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;padding:0 24px;text-decoration:none;font-size:14px;font-weight:500;border:1px solid var(--line);color:var(--ink);transition:border-color .2s,background .2s,color .2s}
  .btn:hover{border-color:var(--ink)}
  .wa-note{color:var(--muted);font-size:13px;margin:10px 0 0}
  .muted-link{display:inline-block;margin-top:22px;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
  .noref{display:none}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">MF</div>
    <h1>¡Pago recibido!</h1>
    <p id="intro">Recibimos tu pedido correctamente. Tu pago fue procesado y ya tenemos la información de tu pedido.</p>
    <p class="ref" id="refBox" hidden>Referencia de tu pedido: <b id="refNum"></b></p>

    <div class="summary" id="resumen"></div>

    <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener">Hablar por WhatsApp</a>
    <p class="wa-note">Opcional — escríbenos solo si necesitas ayuda con tu pedido.</p>

    <a class="muted-link" href="/">Volver a la tienda</a>
  </div>
  <script>
  (async function () {
    var WHATSAPP_NUMBER = "573115752334";
    var params = new URLSearchParams(window.location.search);
    var ref = params.get("ref") || "";
    var intro = document.getElementById("intro");
    var title = document.querySelector("h1");
    var resumenEl = document.getElementById("resumen");
    var waBtn = document.getElementById("waBtn");
    var refBox = document.getElementById("refBox");
    var refNum = document.getElementById("refNum");

    if (!ref) {
      title.textContent = "Regresaste del proceso de pago";
      intro.textContent = "No recibimos una referencia de pedido. El estado del pago debe confirmarse desde el servidor.";
      resumenEl.style.display = "none";
      waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("Hola, MF Colombia. Regresé del proceso de pago y necesito confirmar el estado de mi pedido.");
      return;
    }

    refNum.textContent = ref;
    refBox.hidden = false;

    try {
      var res = await fetch("/.netlify/functions/order-status?ref=" + encodeURIComponent(ref), { cache: "no-store" });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "No se pudo consultar el pedido.");

      if (data.paymentStatus === "aprobado") {
        title.textContent = "Pago confirmado";
        intro.textContent = "El servidor confirmó que tu pago fue aprobado.";
      } else if (data.paymentStatus === "rechazado" || data.paymentStatus === "anulado") {
        title.textContent = "Pago no confirmado";
        intro.textContent = "Regresaste del proceso de pago, pero el servidor no tiene un pago aprobado para este pedido.";
      } else {
        title.textContent = "Regresaste del proceso de pago";
        intro.textContent = "Tu regreso desde Bold fue recibido, pero el servidor todavía no confirma un pago aprobado.";
      }

      resumenEl.textContent = "Referencia: " + data.reference + "\nEstado del pago: " + data.paymentStatus;
      var localRaw = localStorage.getItem("mf_order_" + ref);
      var msg = "Hola, MF Colombia. Regresé del proceso de pago (referencia " + ref + "). Estado confirmado por el servidor: " + data.paymentStatus + ".";
      if (localRaw) {
        try {
          var o = JSON.parse(localRaw);
          resumenEl.textContent += "\n\n" + (o.pedidoTxt || "") + "\nTotal: " + (o.total || "");
          msg += "\n" + (o.pedidoTxt || "") + "\nTotal: " + (o.total || "");
          if (data.paymentStatus === "aprobado") localStorage.removeItem("mf_order_" + ref);
        } catch (e) {}
      }
      waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
    } catch (error) {
      title.textContent = "Regresaste del proceso de pago";
      intro.textContent = "No pudimos consultar el estado confirmado del pedido en este momento. No asumimos que el pago fue aprobado.";
      resumenEl.textContent = "Referencia: " + ref;
      waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("Hola, MF Colombia. Necesito confirmar el estado del pedido " + ref + ".");
    }
  })();
  </script>
</body>
</html>

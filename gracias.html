<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Pago recibido! — MF</title>
<meta name="description" content="Confirmación de pago de tu pedido con MF.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EFE7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1613'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23B08F63' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#dfe8d3;--paper:rgba(255,255,255,.6);--ink:#111;--muted:#555;--serif:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--sans:"Figtree",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#1b1b1b;color:var(--ink);font-family:var(--sans);padding:24px 12px calc(24px + env(safe-area-inset-bottom));line-height:1.45}
  .card{width:min(390px,calc(100vw - 24px));min-height:min(780px,calc(100dvh - 24px));padding:24px 24px 32px;border-radius:32px;background:var(--bg);display:flex;flex-direction:column;text-align:center}
  .mark{width:52px;height:52px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:24px auto 24px;font-size:24px;font-weight:700}
  h1{font-family:var(--serif);font-weight:800;font-size:33.6px;letter-spacing:-.03em;line-height:.98;margin:0 0 14px}
  p{color:#333;font-size:15px;margin:0 0 8px}
  .ref{display:block;margin:24px 0 0;padding:16px;border-radius:24px;border:0;background:var(--paper);font-size:13.5px;color:var(--ink)}
  .ref b{font-weight:700;letter-spacing:.02em}
  .summary{display:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;padding:0 24px;text-decoration:none;font-size:16px;font-weight:600;border:2px solid #111;border-radius:999px;background:#111;color:#fff;margin-top:auto}
  .btn:hover{background:transparent;color:#111}
  .wa-note{display:none}
  .muted-link{display:inline-block;margin-top:16px;color:#555;font-size:13.5px;text-decoration:none}
  .noref{display:none}
  .card:after{content:"MF";font-family:var(--serif);font-size:14px;color:#555;margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">MF</div>
    <h1>Consultando el estado de tu pago…</h1>
    <p id="intro">Estamos verificando en el servidor si tu pago fue aprobado. No asumimos que el pago está confirmado hasta recibir esa confirmación.</p>
    <p class="ref" id="refBox" hidden>Referencia de tu pedido: <b id="refNum"></b></p>

    <div class="summary" id="resumen"></div>

    <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener">Hablar por WhatsApp</a>
    <p class="wa-note">Opcional — escríbenos solo si necesitas ayuda con tu pedido.</p>

    <a class="muted-link" href="/">Volver a la tienda</a>
  </div>
  <script>
  (async function () {
    var WHATSAPP_NUMBER = "573115752334";
    var params = new URLSearchParams(window.location.search);
    var ref = params.get("ref") || "";
    var intro = document.getElementById("intro");
    var title = document.querySelector("h1");
    var resumenEl = document.getElementById("resumen");
    var waBtn = document.getElementById("waBtn");
    var refBox = document.getElementById("refBox");
    var refNum = document.getElementById("refNum");

    if (!ref) {
      title.textContent = "Regresaste del proceso de pago";
      intro.textContent = "No recibimos una referencia de pedido. El estado del pago debe confirmarse desde el servidor.";
      resumenEl.style.display = "none";
      waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("Hola, MF. Regresé del proceso de pago y necesito confirmar el estado de mi pedido.");
      return;
    }

    refNum.textContent = ref;
    refBox.hidden = false;

    var data = null;
    var lastTemporaryError = null;
    var permanentError = null;
    var maxAttempts = 8;

    for (var attempts = 1; attempts <= maxAttempts; attempts += 1) {
      try {
        var res = await fetch("/.netlify/functions/order-status?ref=" + encodeURIComponent(ref), { cache: "no-store" });

        if (res.ok) {
          var nextData = await res.json().catch(function () { return null; });
          var validStatuses = ["pendiente", "aprobado", "rechazado", "anulado"];
          var validReference = nextData && typeof nextData.reference === "string" && nextData.reference.length > 0;
          var validStatus = nextData && validStatuses.indexOf(nextData.paymentStatus) !== -1;

          if (!validReference || !validStatus) {
            permanentError = new Error("La respuesta del servidor no contiene un estado de pago válido.");
            break;
          }

          if (nextData.reference !== ref) {
            permanentError = new Error("La referencia devuelta por el servidor no coincide con el pedido.");
            break;
          }

          data = nextData;
          if (data.paymentStatus === "aprobado" || data.paymentStatus === "rechazado" || data.paymentStatus === "anulado") break;
        } else if (res.status === 429 || res.status >= 500) {
          lastTemporaryError = new Error("Respuesta temporal del servidor: HTTP " + res.status);
        } else {
          permanentError = new Error("No se pudo consultar el pedido (HTTP " + res.status + ").");
          break;
        }
      } catch (error) {
        lastTemporaryError = error;
      }

      if (attempts < maxAttempts) {
        await new Promise(function (resolve) { setTimeout(resolve, 1500); });
      }
    }

    if (permanentError) {
      title.textContent = "No pudimos verificar el pago";
      intro.textContent = "No fue posible validar de forma segura el estado de tu pedido. El pago no se considera confirmado.";
      resumenEl.textContent = "Referencia: " + ref;
      waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("Hola, MF. Necesito confirmar el estado del pedido " + ref + ".");
      return;
    }

    if (!data) {
      title.textContent = "No pudimos verificar el pago";
      intro.textContent = "No fue posible verificar el estado del pedido en este momento. El pago no se considera confirmado.";
      resumenEl.textContent = "Referencia: " + ref;
      waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("Hola, MF. Necesito confirmar el estado del pedido " + ref + ".");
      return;
    }

    if (data.paymentStatus === "aprobado") {
      title.textContent = "Pedido recibido";
      intro.textContent = "Gracias por elegir MF. Hemos recibido tu pedido y te escribiremos por WhatsApp con los detalles del envío.";
    } else if (data.paymentStatus === "rechazado" || data.paymentStatus === "anulado") {
      title.textContent = "Pago no confirmado";
      intro.textContent = "No pudimos confirmar el pago de este pedido.";
    } else {
      title.textContent = "Pedido recibido";
      intro.textContent = "Tu pedido fue recibido y estamos verificando el estado del pago.";
    }

    resumenEl.textContent = "Referencia: " + data.reference + "\nEstado del pago: " + data.paymentStatus;
    var localRaw = localStorage.getItem("mf_order_" + ref);
    var msg = "Hola, MF. Regresé del proceso de pago (referencia " + ref + "). Estado confirmado por el servidor: " + data.paymentStatus + ".";
    if (localRaw) {
      try {
        var o = JSON.parse(localRaw);
        resumenEl.textContent += "\n\n" + (o.pedidoTxt || "") + "\nTotal: " + (o.total || "");
        msg += "\n" + (o.pedidoTxt || "") + "\nTotal: " + (o.total || "");
        if (data.paymentStatus === "aprobado") localStorage.removeItem("mf_order_" + ref);
      } catch (e) {}
    }
    waBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
  })();
  </script>
</body>
</html>

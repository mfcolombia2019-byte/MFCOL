<style>

:root{

.section{

.h-sec{

.link-u{

.btn{

  display:inline-flex;

.btn-solid-light{

  background:#fff;

  color:#111;

  border-color:#fff;

}

.btn-solid-light:hover{

  color:#fff;

  border-color:#111;

}

}

}

.icon-btn{

}

.icon-btn svg,

.ic{

}

/* =========================

   ANNOUNCEMENT

========================= */

.top{

/* =========================

   HEADER

========================= */

  text-decoration:none;

  color:#111;

}

.logo-brand{

.nav{

========================= */

.menu{

  transition:

    opacity .25s,

    transform .25s,

    visibility 0s .25s;

}

.menu.open{

  opacity:1;

  transform:none;

    transform .25s;

}

}

.media{

}

}

}

}

/* =========================

   HERO

========================= */

.hero{

  display:grid;

}

========================= */

.feature-section{

  padding-top:0;

}

========================= */

.editorial{

}

}

    padding:60px clamp(40px,6vw,90px);

  }

/* =========================

   CATEGORIES

========================= */

.cats-wrap{

  padding-top:0;

}

.cats{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.cat-tile{

  position:relative;

  display:block;

  text-decoration:none;

  overflow:hidden;

}

.cat-tile .r45{

}

.cat-tile:hover .r45{

  transform:scale(1.025);

}

.cat-tile::after{

  content:"";

  position:absolute;

  inset:0;

  background:

    linear-gradient(

      0deg,

      rgba(0,0,0,.42),

      transparent 42%

    );

}

.cat-name{

  position:absolute;

  left:16px;

  bottom:14px;

  z-index:2;

  color:#fff;

  font-family:var(--serif);

  font-size:clamp(24px,4vw,46px);

  line-height:1;

}

@media(max-width:520px){

  .cats{

    grid-template-columns:1fr;

  }

  .cat-tile .r45{

    aspect-ratio:3/4;

  }

}

   COLLECTION

========================= */

.collection-head{

}

.count{

.grid{

  }

  }

}

.card{

  min-width:0;

}

.card-media{

  position:relative;

  display:block;

  width:100%;

  border:0;

  background:none;

  padding:0;

  text-align:left;

}

.tag{

  position:absolute;

  top:10px;

  left:10px;

  z-index:3;

.sizes{

}

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:5px;

}

.chip{

  position:relative;

}

.chip input{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  opacity:0;

  cursor:pointer;

  margin:0;

}

.chip span{

  display:grid;

  place-items:center;

  min-width:40px;

  height:38px;

  border:1px solid #ddd;

  background:#fff;

  font-size:12px;

  padding:0 9px;

}

.chip input:checked+span{

  background:#111;

  border-color:#111;

  color:#fff;

}

.chip:hover span{

  border-color:#111;

}

[data-field="color"] .chip span{

  min-width:58px;

  height:52px;

  gap:5px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  font-size:9px;

  height:15px;

  border-radius:50%;

  border:1px solid rgba(0,0,0,.18);

}

  color:#777;

  font-size:12px;

  margin-top:8px;

}

.need{

}

.need .chip span{

  border-color:#111;

}

@keyframes shake{

  0%,

  100%{

    transform:none;

  }

  30%{

    transform:translateX(-4px);

  }

  70%{

    transform:translateX(4px);

  }

}

/* =========================

   SPOTLIGHT PRODUCT

========================= */

.spot{

  display:grid;

  grid-template-columns:1fr;

  background:#111;

  color:#fff;

}

.spot-media{

  min-height:72svh;

  position:relative;

}

.spot-media .media{

  position:absolute;

  inset:0;

  height:100%;

  aspect-ratio:auto;

}

.spot-info{

  padding:48px var(--gutter) 62px;

}

.spot .cat{

  font-size:10px;

  letter-spacing:.14em;

  text-transform:uppercase;

  color:#aaa;

}

.spot h2{

  font-family:var(--serif);

  font-size:clamp(40px,6vw,78px);

  line-height:.92;

  font-weight:400;

  margin:14px 0;

}

.spot .desc{

  color:#bbb;

  max-width:44ch;

  font-size:14px;

  margin-bottom:18px;

}

.spot .price{

  font-family:var(--serif);

  font-size:24px;

  font-weight:400;

}

.spot .sizes legend{

  color:#aaa;

}

.spot .chip span{

  background:transparent;

  border-color:#444;

  color:#fff;

}

.spot .chip input:checked+span{

  background:#fff;

  color:#111;

  border-color:#fff;

}

.spot-btns{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:22px;

}

@media(min-width:820px){

  .spot{

    grid-template-columns:1.35fr .65fr;

    min-height:90svh;

  }

  .spot-media{

    min-height:90svh;

  }

  .spot-info{

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:70px clamp(40px,6vw,90px);

  }

}

/* =========================

   PHILOSOPHY

========================= */

.about{

  padding-top:0;

}

.about-grid{

  display:grid;

  grid-template-columns:1fr;

  gap:36px;

}

.about-copy{

  max-width:700px;

}

.about p.lead{

  font-family:var(--serif);

  font-size:clamp(30px,4.5vw,58px);

  line-height:1.02;

  letter-spacing:-.025em;

  margin:22px 0 30px;

}

.about-image{

  min-height:70svh;

}

@media(min-width:820px){

  .about-grid{

    grid-template-columns:.8fr 1.2fr;

    gap:80px;

    align-items:start;

  }

  .about-copy{

    padding-top:40px;

  }

  .about-image{

    min-height:80svh;

  }

}

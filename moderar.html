<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moderación — Comunidad Marlon</title>
<style>
  :root{--ivory:#F3EFE7;--ink:#1A1613;--muted:#726A5E;--line:#DDD5C4;--champagne:#B08F63;--mauve:#7A4D5E;--serif:"Fraunces","Cormorant Garamond",Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.5 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;padding:24px 16px 64px}
  main{max-width:720px;margin:0 auto}
  h1{font:500 30px var(--serif);margin:0 0 4px}h2{font:500 22px var(--serif);margin:36px 0 12px}
  p.m{color:var(--muted);margin:0 0 16px}
  input,select{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:16px;outline:0;margin-bottom:12px}
  button{font:500 13px "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.02em;min-height:44px;padding:0 16px;border:1px solid var(--ink);background:none;cursor:pointer}
  button.s{background:var(--ink);color:#fff}
  .post{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
  .post img{width:110px;aspect-ratio:4/5;object-fit:cover;background:#E9E3D6}
  .ph{width:110px;aspect-ratio:4/5;background:#E9E3D6;display:grid;place-items:center;font-size:12px;color:var(--muted)}
  .post strong{font:500 20px var(--serif)}.st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--champagne)}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #link{word-break:break-all;background:#fff;padding:12px;border:1px solid var(--line);margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>Comunidad Marlon</h1>
  <p class="m">Panel privado de moderación.</p>

  <div id="login">
    <input id="key" type="password" placeholder="Clave de administración (ADMIN_PASSWORD)" autocomplete="current-password">
    <button class="s" id="go" type="button">Entrar</button>
    <p class="m" id="lerr" style="color:var(--mauve);margin-top:12px"></p>
  </div>

  <div id="panel" hidden>
    <h2>Enlace de compra verificada</h2>
    <p class="m">Genera un enlace para enviarle a la clienta por WhatsApp o correo después de su compra.</p>
    <select id="prod"></select>
    <input id="ref" placeholder="Referencia del pedido o nombre de la clienta (opcional)">
    <button class="s" id="mk" type="button">Generar enlace</button>
    <div id="link" hidden></div>

    <h2>Fotografías y reseñas</h2>
    <div id="list"></div>
  </div>
</main>
<script>
(function () {
  var API = "/.netlify/functions/comunidad", K = sessionStorage.getItem("mfk") || "";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var H = function () { return { "x-admin-key": K }; };
  var LABEL = { pending: "Pendiente de revisión", approved: "Aprobada", rejected: "Rechazada" };

  function load() {
    fetch(API + "?action=all", { headers: H() }).then(function (r) {
      if (!r.ok) throw new Error(r.status === 401 ? "Clave incorrecta." : "No se pudo cargar.");
      return r.json();
    }).then(function (all) {
      $("#login").hidden = true; $("#panel").hidden = false;
      var order = { pending: 0, approved: 1, rejected: 2 };
      all.sort(function (a, b) { return order[a.status] - order[b.status] || b.created - a.created; });
      $("#list").innerHTML = all.length ? all.map(function (p) {
        return '<div class="post" data-id="' + p.id + '">' + (p.hasPhoto ? '<img alt="">' : '<div class="ph">Sin foto</div>') +
          '<div><span class="st">' + LABEL[p.status] + (p.featured ? " · Destacada" : "") + (p.verified ? " · ✓ Compra verificada" : "") + "</span><br><strong>" + esc(p.productName) + "</strong>" +
          "<div>" + "★".repeat(p.rating) + "☆".repeat(5 - p.rating) + (p.instagram ? " · @" + esc(p.instagram) : "") + "</div><div>" + esc(p.text) + "</div>" +
          '<div class="acts">' + (p.status !== "approved" ? '<button class="s" data-op="approve">Aprobar</button>' : "") +
          (p.status !== "rejected" ? '<button data-op="reject">Rechazar</button>' : "") +
          (p.status === "approved" && p.hasPhoto ? '<button data-op="feature">' + (p.featured ? "Quitar de portada" : "Destacar") + "</button>" : "") +
          '<button data-op="delete">Eliminar</button></div></div></div>';
      }).join("") : '<p class="m">Aún no hay envíos.</p>';
      all.filter(function (p) { return p.hasPhoto; }).forEach(function (p) {   // la foto pendiente solo se ve con tu clave
        fetch(API + "?action=photo&id=" + p.id, { headers: H() }).then(function (r) { return r.blob(); }).then(function (b) {
          var im = document.querySelector('[data-id="' + p.id + '"] img'); if (im) im.src = URL.createObjectURL(b);
        });
      });
    }).catch(function (e) { $("#login").hidden = false; $("#panel").hidden = true; $("#lerr").textContent = e.message; });
  }

  function post(action, body) {
    return fetch(API + "?action=" + action, { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, H()), body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Error"); return d; }); });
  }

  $("#go").onclick = function () { K = $("#key").value.trim(); sessionStorage.setItem("mfk", K); load(); };
  $("#list").onclick = function (e) {
    var b = e.target.closest("[data-op]"); if (!b) return;
    if (b.dataset.op === "delete" && !confirm("¿Eliminar definitivamente?")) return;
    post("moderate", { id: b.closest(".post").dataset.id, op: b.dataset.op }).then(load).catch(function (x) { alert(x.message); });
  };
  $("#mk").onclick = function () {
    var o = $("#prod").selectedOptions[0]; if (!o) return;
    post("issue-token", { products: [{ id: o.value, name: o.textContent }], ref: $("#ref").value }).then(function (d) {
      var l = $("#link"); l.hidden = false; l.textContent = d.url;
      if (navigator.clipboard) navigator.clipboard.writeText(d.url).catch(function () {});
    }).catch(function (x) { alert(x.message); });
  };

  // Lista de modelos: se lee del catálogo de la tienda (index.html).
  fetch("/").then(function (r) { return r.text(); }).then(function (t) {
    var re = /\{id:"([a-z0-9-]+)",name:"([^"]+)"/g, m, h = "";
    while ((m = re.exec(t))) h += '<option value="' + m[1] + '">' + esc(m[2]) + "</option>";
    $("#prod").innerHTML = h;
  });

  if (K) load();
})();
</script>
</body>
</html>

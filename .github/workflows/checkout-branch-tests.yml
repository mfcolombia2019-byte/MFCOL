name: Checkout branch regression tests

on:
  push:
    branches:
      - fix/bold-single-checkout-flow
  pull_request:
    branches:
      - fix/bold-single-checkout-flow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full test suite
        run: node --test --experimental-test-module-mocks tests/*.test.mjs
